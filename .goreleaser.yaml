# GoReleaser config for Git Flow Plus — see Building.md and
# ReleaseProcess.md. Replaces the formerly hand-maintained
# scripts/build.{sh,ps1} + scripts/package.{sh,ps1} pair (same
# cross-compile/archive/checksum logic, written twice, once per shell —
# this is the single source of truth instead).
#
# Local dry run (no tag, no publish, no GitHub token required):
#   goreleaser release --snapshot --clean
# (or `make package`, which calls exactly that)
#
# CI (.github/workflows/release.yml) runs `goreleaser release --clean` on
# every "v*" tag push, which additionally publishes the GitHub Release.
# The Windows installer (NSIS) and macOS .pkg are NOT built here — nfpm
# (below) only knows how to produce Linux packages, and NSIS/pkgbuild
# have nothing to do with GoReleaser's own build/archive pipeline. Both
# are built in their own CI jobs (windows-latest / macos-latest, since
# makensis and pkgbuild only run on their native OS) and uploaded to the
# release GoReleaser creates via `gh release upload`, once it exists —
# see build/windows/create-installer.ps1, scripts/package-macos-pkg.sh,
# and Packaging.md.
version: 2

project_name: git-flow-plus

before:
  hooks:
    # Embeds build/windows/icon.ico and version metadata into the
    # windows/amd64 + windows/arm64 binaries via a Go resource object
    # (.syso) — go build links it in automatically for any windows
    # target with no further flags, since it's simply present next to
    # cmd/git-flow-plus/main.go. Pure Go tool; runs fine on any host OS,
    # so this stays a single hook here rather than needing to move into
    # one of the Windows-only jobs. "git-tag" pulls the version directly
    # from the tag being released — see Packaging.md#executable-icon.
    - go install github.com/tc-hib/go-winres@latest
    - >-
      go-winres simply
      --arch amd64,arm64
      --out cmd/git-flow-plus/rsrc
      --product-version git-tag
      --file-version git-tag
      --manifest cli
      --file-description "Git Flow Plus"
      --product-name "Git Flow Plus"
      --copyright "Copyright (c) Git Flow Plus Contributors"
      --original-filename git-flow-plus.exe
      --icon build/windows/icon.ico

builds:
  - id: git-flow-plus
    main: ./cmd/git-flow-plus
    binary: git-flow-plus
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/tabnaeem/git-flow-plus/internal/cli.Version={{ .Version }}
      - -X github.com/tabnaeem/git-flow-plus/internal/cli.BuildNumber={{ if index .Env "BUILD_NUMBER" }}{{ index .Env "BUILD_NUMBER" }}{{ else }}dev{{ end }}
      - -X github.com/tabnaeem/git-flow-plus/internal/cli.GitCommit={{ .ShortCommit }}
      - -X github.com/tabnaeem/git-flow-plus/internal/cli.GitBranch={{ .Branch }}
      # .CommitDate, not .Date (the actual wall-clock build time): two
      # builds of the exact same commit/tag should produce byte-identical
      # binaries. Using the real build timestamp here would make that
      # impossible, since it differs on every run even for identical
      # inputs — see Packaging.md#reproducible-builds.
      - -X github.com/tabnaeem/git-flow-plus/internal/cli.BuildDate={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: git-flow-plus
    ids:
      - git-flow-plus
    name_template: "git-flow-plus-{{ .Os }}-{{ .Arch }}"
    wrap_in_directory: false
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# One CycloneDX SBOM per archive, listing every Go module compiled into
# that binary — attached to the release alongside the archive itself.
# Requires `syft` on PATH (installed via a dedicated CI step; see
# release.yml) — this is GoReleaser's own documented mechanism, not a
# custom script, so it stays a single source of truth.
sboms:
  - id: archives
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"

# .deb and .rpm for Linux — satisfies BUILD PIPELINE's "Linux: deb, rpm".
# Windows (.exe/.msi) and macOS (.pkg) are built separately (see the
# header comment above) since nfpm only targets Linux.
nfpms:
  - id: git-flow-plus
    ids:
      - git-flow-plus
    package_name: git-flow-plus
    file_name_template: "git-flow-plus-{{ .Version }}-{{ .Arch }}"
    vendor: Git Flow Plus Contributors
    homepage: https://github.com/tabnaeem/git-flow-plus
    maintainer: Tabish Naeem <mtnaeem9108@sbtjapan.com>
    description: >-
      Git Flow with enterprise release management — Sprint.Feature.
      ReleaseFix.DevOps.QA versioning, mandatory release tagging, and a
      Feature Registry, on top of the standard Git Flow branching model.
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      # `git flow ...` only resolves as a Git subcommand if a binary
      # literally named "git-flow" is on PATH — see internal/cli/doctor.go's
      # PATH check and WindowsInstallation.md's equivalent note for the
      # Windows installer.
      - src: /usr/bin/git-flow-plus
        dst: /usr/bin/git-flow
        type: symlink

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: tabnaeem
    name: git-flow-plus
  name_template: "Git Flow Plus {{ .Tag }}"
  header: |
    See [ReleaseNotes.md](https://github.com/tabnaeem/git-flow-plus/blob/main/ReleaseNotes.md) for the full changelog and [Installation.md](https://github.com/tabnaeem/git-flow-plus/blob/main/Installation.md) to get started.
  footer: |
    **Checksums:** verify any downloaded asset against `checksums.txt` (see [Installation.md](https://github.com/tabnaeem/git-flow-plus/blob/main/Installation.md#verifying-a-download)).
