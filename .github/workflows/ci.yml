name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -cover

  race:
    # Race detector needs cgo; run it on Linux only, where it's cheapest
    # and most reliable to enable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test with race detector
        run: go test ./... -race

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check gofmt formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # v6 predates golangci-lint v2 support (the action's own compat
      # table: "v7.0.0 supports golangci-lint v2 only") — v9 is the
      # current major, verified compatible with `version: latest`
      # resolving to v2.x. See Troubleshooting.md#cicd for the incident
      # this fixed.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
