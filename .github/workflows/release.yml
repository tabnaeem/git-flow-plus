name: Release

# Triggered by pushing a tag like "v5.3.4.1.2". Two jobs:
#   goreleaser  (windows)  refuses to run if a release for this tag
#                          already exists (releases are immutable — see
#                          below), then tests, lints, cross-compiles all
#                          6 platforms via GoReleaser, packages archives
#                          + checksums + SBOM + .deb/.rpm, builds the
#                          NSIS Windows installer as part of that same
#                          run, creates the GitHub Release itself, and
#                          attests build provenance for every artifact.
#   macos-pkg   (macos)    builds a universal .pkg and uploads it to the
#                          release the goreleaser job just created.
#
# Why `goreleaser` runs on windows-latest, not ubuntu-latest: the NSIS
# installer is built by this build's own `hooks.post` in
# .goreleaser.yaml, which requires makensis on PATH — and NSIS only
# exists on Windows. Go's cross-compilation is host-independent (a
# Windows host cross-compiles linux/darwin targets exactly as easily as
# a Linux host cross-compiles windows targets), and nfpm's .deb/.rpm
# packaging is pure Go with no OS-native tool dependency either, so
# nothing else about the pipeline needs to move — this one runs-on
# change is what lets a single `goreleaser release` produce and publish
# every artifact, including the installer, instead of a separate
# after-the-fact upload job. macOS's .pkg still can't be folded in the
# same way — pkgbuild/productbuild only exist on macOS — so that stays
# its own job, gated on the release already existing. See Packaging.md
# and ReleaseProcess.md for the full writeup.
#
# Immutability: neither GoReleaser's own publish step nor the macOS
# upload step uses `--clobber` — if an asset with that name already
# exists (e.g. a job is manually re-run against an already-published
# release), the upload fails loudly instead of silently overwriting a
# published artifact. A genuinely bad release should be fixed by
# yanking it and publishing a new tag, not by mutating one that already
# shipped.
#
# Fail-fast on a missing installer: build-installer-hook.ps1 runs
# strictly before GoReleaser's archive/checksum/publish phases (that's
# what a *post*-build hook means), and a non-zero exit from it aborts
# the whole `goreleaser release` command immediately — confirmed
# empirically during development (a failing hook produces "build
# failed", not a partial release). So there's no separate "does the
# installer exist" check to keep in sync: if it's missing, the release
# never gets far enough to publish anything at all.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # actions/attest-build-provenance
  attestations: write

jobs:
  goreleaser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so GoReleaser's changelog resolves correctly

      - name: Verify this release doesn't already exist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A GitHub Release for tag $GITHUB_REF_NAME already exists. Releases are immutable here — delete it explicitly first if this was intentional, or push a new tag."
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      # v6 predates golangci-lint v2 support (the action's own compat
      # table: "v7.0.0 supports golangci-lint v2 only") — v9 is the
      # current major, verified compatible with `version: latest`
      # resolving to v2.x. See Troubleshooting.md#cicd for the incident
      # this fixed.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install -y nsis --no-progress
          }

      - name: Install syft (SBOM generation)
        uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Verify the Windows installer was produced
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/installer/GitFlowPlusSetup_*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No GitFlowPlusSetup_*.exe found under dist/installer/ after goreleaser release. The installer build hook should have failed the release before reaching this point — if you're seeing this, that fail-fast mechanism itself regressed."
            exit 1
          fi
          echo "Found installer: ${files[0]}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.tar.gz,dist/*.zip,dist/*.deb,dist/*.rpm,dist/*.sbom.json,dist/installer/*.exe"

  macos-pkg:
    needs: goreleaser
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Compute version string
        id: ver
        run: echo "full=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build darwin/amd64 and darwin/arm64 binaries
        env:
          LDFLAGS_PKG: github.com/tabnaeem/git-flow-plus/internal/cli
          FULL_VERSION: ${{ steps.ver.outputs.full }}
        run: |
          set -euo pipefail
          LDFLAGS="-s -w \
            -X ${LDFLAGS_PKG}.Version=${FULL_VERSION} \
            -X ${LDFLAGS_PKG}.BuildNumber=${{ github.run_number }} \
            -X ${LDFLAGS_PKG}.GitCommit=$(git rev-parse --short HEAD) \
            -X ${LDFLAGS_PKG}.GitBranch=${GITHUB_REF_NAME} \
            -X ${LDFLAGS_PKG}.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for arch in amd64 arm64; do
            mkdir -p "dist/macos-$arch"
            GOOS=darwin GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "$LDFLAGS" -o "dist/macos-$arch/git-flow-plus" ./cmd/git-flow-plus
          done

      - name: Build universal .pkg
        run: |
          ./scripts/package-macos-pkg.sh \
            "${{ steps.ver.outputs.full }}" \
            dist/macos-amd64/git-flow-plus \
            dist/macos-arm64/git-flow-plus \
            "dist/installer/git-flow-plus-${{ steps.ver.outputs.full }}-macos-universal.pkg"

      - name: Checksum
        run: |
          cd dist/installer
          shasum -a 256 *.pkg > macos-checksums.txt
          cat macos-checksums.txt

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/installer/*.pkg dist/installer/macos-checksums.txt
