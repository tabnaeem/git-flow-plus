name: Release

# Triggered by pushing a tag like "v5.3.4.1.2". Three jobs:
#   goreleaser        (ubuntu)  refuses to run if a release for this tag
#                                already exists (releases are immutable —
#                                see below), then tests, lints,
#                                cross-compiles all 6 platforms via
#                                GoReleaser, packages archives +
#                                checksums + SBOM + .deb/.rpm, creates
#                                the GitHub Release itself, and attests
#                                build provenance for every artifact.
#   windows-installer  (windows) builds the NSIS .exe and uploads it to
#                                the release the goreleaser job just
#                                created.
#   macos-pkg           (macos)  builds a universal .pkg and uploads it
#                                the same way.
# windows-installer/macos-pkg can't run inside GoReleaser itself — NSIS
# and pkgbuild/productbuild only exist on their native OS — so they run
# as separate jobs gated on the release already existing. See
# Packaging.md and ReleaseProcess.md for the full writeup.
#
# Immutability: neither Windows/macOS upload step uses `gh release
# upload --clobber` — if an asset with that name already exists (e.g. a
# job is manually re-run against an already-published release), the
# upload fails loudly instead of silently overwriting a published
# artifact. A genuinely bad release should be fixed by yanking it and
# publishing a new tag, not by mutating one that already shipped.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # actions/attest-build-provenance
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so GoReleaser's changelog resolves correctly

      - name: Verify this release doesn't already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A GitHub Release for tag $GITHUB_REF_NAME already exists. Releases are immutable here — delete it explicitly first if this was intentional, or push a new tag."
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      # v6 predates golangci-lint v2 support (the action's own compat
      # table: "v7.0.0 supports golangci-lint v2 only") — v9 is the
      # current major, verified compatible with `version: latest`
      # resolving to v2.x. See Troubleshooting.md#cicd for the incident
      # this fixed.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Install syft (SBOM generation)
        uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.tar.gz,dist/*.zip,dist/*.deb,dist/*.rpm,dist/*.sbom.json"

  windows-installer:
    needs: goreleaser
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install -y nsis --no-progress
          }

      - name: Embed icon and version resource
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/tc-hib/go-winres@latest
          go-winres simply \
            --arch amd64 \
            --out cmd/git-flow-plus/rsrc \
            --product-version git-tag \
            --file-version git-tag \
            --manifest cli \
            --file-description "Git Flow Plus" \
            --product-name "Git Flow Plus" \
            --copyright "Copyright (c) Git Flow Plus Contributors" \
            --original-filename git-flow-plus.exe \
            --icon build/windows/icon.ico

      - name: Build windows/amd64 binary
        shell: bash
        env:
          LDFLAGS_PKG: github.com/tabnaeem/git-flow-plus/internal/cli
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/windows-x64
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w \
              -X ${LDFLAGS_PKG}.Version=${VERSION} \
              -X ${LDFLAGS_PKG}.BuildNumber=${{ github.run_number }} \
              -X ${LDFLAGS_PKG}.GitCommit=$(git rev-parse --short HEAD) \
              -X ${LDFLAGS_PKG}.GitBranch=${GITHUB_REF_NAME} \
              -X ${LDFLAGS_PKG}.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/windows-x64/git-flow-plus.exe \
            ./cmd/git-flow-plus

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          .\build\windows\create-installer.ps1 -Version $version -BinDir dist\windows-x64 -OutDir dist\installer

      - name: Checksum installer
        shell: bash
        run: |
          cd dist/installer
          sha256sum *.exe > windows-checksums.txt
          cat windows-checksums.txt

      - name: Upload to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/installer/*.exe dist/installer/windows-checksums.txt

  macos-pkg:
    needs: goreleaser
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Compute version string
        id: ver
        run: echo "full=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build darwin/amd64 and darwin/arm64 binaries
        env:
          LDFLAGS_PKG: github.com/tabnaeem/git-flow-plus/internal/cli
          FULL_VERSION: ${{ steps.ver.outputs.full }}
        run: |
          set -euo pipefail
          LDFLAGS="-s -w \
            -X ${LDFLAGS_PKG}.Version=${FULL_VERSION} \
            -X ${LDFLAGS_PKG}.BuildNumber=${{ github.run_number }} \
            -X ${LDFLAGS_PKG}.GitCommit=$(git rev-parse --short HEAD) \
            -X ${LDFLAGS_PKG}.GitBranch=${GITHUB_REF_NAME} \
            -X ${LDFLAGS_PKG}.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for arch in amd64 arm64; do
            mkdir -p "dist/macos-$arch"
            GOOS=darwin GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "$LDFLAGS" -o "dist/macos-$arch/git-flow-plus" ./cmd/git-flow-plus
          done

      - name: Build universal .pkg
        run: |
          ./scripts/package-macos-pkg.sh \
            "${{ steps.ver.outputs.full }}" \
            dist/macos-amd64/git-flow-plus \
            dist/macos-arm64/git-flow-plus \
            "dist/installer/git-flow-plus-${{ steps.ver.outputs.full }}-macos-universal.pkg"

      - name: Checksum
        run: |
          cd dist/installer
          shasum -a 256 *.pkg > macos-checksums.txt
          cat macos-checksums.txt

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/installer/*.pkg dist/installer/macos-checksums.txt
